<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stord Academy – Prototype 3</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#162d44;background:#f0f5fa}*{box-sizing:border-box}body{margin:0}header{background:#102b46;color:white;padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:22px}header small{display:block;color:#bed4e9}.wrap{max-width:1100px;margin:auto;padding:20px 16px}.panel{background:white;border:1px solid #d6e2ec;border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 2px 8px #102b4609}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}.actions{margin:16px 0 0}button{border:0;border-radius:9px;padding:11px 15px;background:#1765a0;color:white;font:inherit;cursor:pointer}button.secondary{background:#e6eef5;color:#123d5b}button.active{background:#102b46}button:disabled{opacity:.45;cursor:not-allowed}h1{font-size:25px;margin:0 0 10px}h2{font-size:19px}h3{font-size:16px}p{line-height:1.55}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{font:inherit;padding:10px;border:1px solid #c4d5e3;border-radius:8px;width:100%;background:white}textarea{min-height:105px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.tile{border:1px solid #d5e2ec;border-radius:11px;padding:15px;background:white;text-align:left;color:#16334b}.tile.locked{background:#f8fafc;color:#7c8a98;cursor:default}.muted{color:#62778b}.small{font-size:13px}.tag{display:inline-block;border-radius:15px;padding:4px 10px;background:#e6eef5;font-size:12px;margin-top:6px}.ok{background:#d9f5e5;color:#135b37}.warn{background:#fff0ca;color:#765006}.err{color:#ad2635}.message{padding:12px;background:#e8f2fa;border-radius:8px;margin:12px 0;white-space:pre-wrap}.message.error{background:#fff0f0;color:#a62334}.hidden{display:none!important}.photos{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.photos img{width:160px;height:125px;object-fit:cover;border-radius:9px;border:1px solid #c7d7e5;cursor:pointer}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}.footer{font-size:12px;color:#657c8e;text-align:center;margin:22px}.login{max-width:480px;margin:50px auto}.counter{background:#eaf1f7;padding:12px;border-radius:10px}.hint{border-left:4px solid #1765a0;padding:10px;background:#f2f7fb}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #86c6ff}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body>
<header><div><strong>STORD ACADEMY</strong><small>Isolatørfaget · Digital opplæring · Prototype 3</small></div><div id="identity"></div></header>
<main class="wrap"><div id="auth"></div><div id="workspace" class="hidden"><div class="tabs"><button id="tab-learner" onclick="tab('learner')">Mine oppgaver</button><button id="tab-instructor" onclick="tab('instructor')">Instruktør</button><button id="tab-settings" onclick="tab('settings')">Oppsett</button></div><div id="notice" aria-live="polite"></div><div id="app"></div></div><p class="footer">Prototype 3 · Oppgaver, svar, bilder og vurderinger lagres i Supabase. Test med testkontoer før ekte lærlingdata brukes.</p></main>
<script>
'use strict';
const URL='https://mrqpkkppyzdplibhwokl.supabase.co';
const KEY='sb_publishable_RrOD-I1Hhvdn8FcAfr1X8Q_PlVCo2Do';
const db=window.supabase?.createClient(URL,KEY);
let user=null,profile=null,days=[],submissions=[],photos=[],learners=[],enrollments=[],view='learner',selectedDay=null,selectedSubmission=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,error=false){$('notice').innerHTML=text?`<div class="message ${error?'error':''}">${esc(text)}</div>`:'';}
function errorText(e){return e?.message||String(e)}
async function check(result){if(result.error)throw result.error;return result.data}
function loginForm(message=''){$('workspace').classList.add('hidden');$('auth').innerHTML=`<div class="panel login"><h1>Logg inn</h1><p class="muted">Stord Academy · Isolatørfaget</p><label>E-post</label><input id="email" type="email" autocomplete="username" placeholder="navn@eksempel.no"><label>Passord</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="login" onclick="login()">Logg inn</button></div><p class="err" id="autherror">${esc(message)}</p><p class="small muted">Kontoen opprettes av instruktør i Supabase.</p></div>`}
async function login(){let b=$('login');b.disabled=true;try{await check(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));await start()}catch(e){$('autherror').textContent=errorText(e);b.disabled=false}}
async function logout(){await db.auth.signOut();user=null;profile=null;loginForm()}
async function start(){try{const a=await check(await db.auth.getUser());if(!a?.user){loginForm();return}user=a.user;profile=await check(await db.from('profiles').select('id,full_name,role').eq('id',user.id).single());$('auth').innerHTML='';$('workspace').classList.remove('hidden');$('identity').innerHTML=`${esc(profile.full_name)} · ${profile.role==='instructor'?'Instruktør':'Lærling'} <button class="secondary" onclick="logout()">Logg ut</button>`;if(profile.role!=='instructor')view='learner';await refresh()}catch(e){loginForm('Innlogging/profil: '+errorText(e))}}
async function refresh(){try{days=await check(await db.from('training_days').select('*').order('day_number'));if(profile.role==='instructor'){
 learners=await check(await db.from('profiles').select('id,full_name,role').eq('role','apprentice').order('full_name'));
 enrollments=await check(await db.from('enrollments').select('*'));
 submissions=await check(await db.from('submissions').select('*').order('updated_at',{ascending:false}));
}else{submissions=await check(await db.from('submissions').select('*').eq('apprentice_id',user.id))}
 const ids=submissions.map(s=>s.id);photos=ids.length?await check(await db.from('submission_photos').select('*').in('submission_id',ids)):[];
 render();}catch(e){msg('Kunne ikke hente data: '+errorText(e),true);render()}}
function tab(v){if(v!=='learner'&&profile.role!=='instructor')return;view=v;selectedDay=null;selectedSubmission=null;msg('');render()}
function render(){for(const v of ['learner','instructor','settings'])$('tab-'+v).classList.toggle('active',view===v);$('tab-instructor').classList.toggle('hidden',profile.role!=='instructor');$('tab-settings').classList.toggle('hidden',profile.role!=='instructor');if(selectedDay!==null){renderTask();return}if(selectedSubmission!==null){renderReview();return}if(view==='learner')renderLearner();else if(view==='instructor')renderInstructor();else renderSettings()}
const statusText={in_progress:'Pågår',submitted:'Til vurdering',approved:'Godkjent',repeat:'Øv mer',guided:'Gjennomgå med instruktør',continue:'Fortsett arbeidet'};
function own(day){return submissions.find(s=>s.training_day_id===day.id&&s.apprentice_id===user.id)}
function openable(day){if(!day.is_published)return false;if(day.day_number===1)return true;let prev=days.find(d=>d.day_number===day.day_number-1);return !!(prev&&own(prev)?.status==='approved')}
function renderLearner(){if(profile.role==='instructor'){$('app').innerHTML='<div class="panel"><h1>Instruktørkonto</h1><p>Du er logget inn som instruktør. Bruk Instruktør-fanen til å vurdere innleveringer. For å teste lærlingflyten, bruk en egen lærlingkonto.</p></div>';return}
 const approved=submissions.filter(s=>s.status==='approved').length;
 $('app').innerHTML=`<div class="panel"><h1>Mine opplæringsoppgaver</h1><p>Du må svare på teori, laste opp bilde og skrive egenvurdering. Instruktøren må godkjenne oppgaven før neste dag åpnes.</p><div class="counter">${approved} av ${days.filter(d=>d.is_published).length} oppgaver godkjent</div></div>`+[1,2,3].map(w=>`<h2>Uke ${w}</h2><div class="grid">`+days.filter(d=>Math.ceil(d.day_number/5)===w).map(d=>{let r=own(d),ok=openable(d),st=r?.status;return `<button class="tile ${ok?'':'locked'}" ${ok?`onclick="openTask(${d.id})"`:'disabled'}><b>Dag ${d.day_number}: ${esc(d.title)}</b><br><span class="tag ${st==='approved'?'ok':st==='submitted'?'warn':''}">${esc(st?statusText[st]:(ok?'Klar':'Låst'))}</span></button>`}).join('')+'</div>').join('')}
function openTask(id){selectedDay=id;msg('');render()}
function back(){selectedDay=null;selectedSubmission=null;msg('');refresh()}
function renderTask(){const d=days.find(x=>x.id===selectedDay),r=own(d);if(!d||!openable(d)){back();return}const readonly=['submitted','approved'].includes(r?.status);let answers=r?.theory_answers||{};let qs=Array.isArray(d.theory_questions)?d.theory_questions:[];
 $('app').innerHTML=`<button class="secondary" onclick="back()">← Til oversikten</button><div class="panel" style="margin-top:14px"><h1>Dag ${d.day_number}: ${esc(d.title)}</h1><p><span class="tag">${esc(statusText[r?.status]||'Ikke startet')}</span></p>${r?.instructor_feedback?`<div class="hint"><b>Tilbakemelding fra instruktør</b><p>${esc(r.instructor_feedback)}</p></div>`:''}<h2>Teori</h2>`+qs.map((q,i)=>`<label for="q${i}">${i+1}. ${esc(q)}</label><textarea id="q${i}" ${readonly?'disabled':''}>${esc(answers[i]||'')}</textarea>`).join('')+`<h2>Praktisk arbeid</h2><p>${esc(d.practical_instructions)}</p><label>Bilder av arbeidet (minst ett)</label><p class="small muted">JPG, PNG eller WebP. Maks 10 MB per bilde. Ikke ta bilder av personer uten tillatelse.</p>${readonly?'':`<input id="image" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="secondary" onclick="uploadImages()">Last opp valgte bilder</button></div>`}<div class="photos" id="photolist"></div><label for="reflection">Egenvurdering: Hva gikk bra, og hva var vanskelig?</label><textarea id="reflection" ${readonly?'disabled':''}>${esc(r?.reflection||'')}</textarea>${readonly?'<p class="muted">Oppgaven er låst mens instruktøren vurderer den, eller etter godkjenning.</p>':`<p class="small muted">Du kan lagre kladd selv om noe mangler. Innlevering krever alle svar, egenvurdering og minst ett opplastet bilde.</p><div class="actions"><button class="secondary" onclick="saveTask(false)">Lagre kladd</button><button onclick="saveTask(true)">Lever til instruktør</button></div>`}</div>`;renderPhotoList(r?.id)}
async function renderPhotoList(submissionId){const holder=$('photolist');if(!holder)return;holder.innerHTML='';for(const p of photos.filter(p=>p.submission_id===submissionId)){const {data,error}=await db.storage.from('training-photos').createSignedUrl(p.storage_path,300);if(error){holder.innerHTML+='<span class="err">Kunne ikke vise bilde</span>';continue}const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=data.signedUrl;img.alt='Opplastet bilde av praktisk arbeid';a.append(img);holder.append(a)}}
function fields(){let d=days.find(x=>x.id===selectedDay),qs=d.theory_questions||[];return {answers:Object.fromEntries(qs.map((_,i)=>[String(i),$('q'+i).value.trim()])),reflection:$('reflection').value.trim()}}
async function saveTask(submit){const d=days.find(x=>x.id===selectedDay),f=fields();if(submit){if(Object.values(f.answers).some(x=>!x)||!f.reflection){msg('Svar på alle teorispørsmål og fyll ut egenvurderingen før levering.',true);return}if(!photos.some(p=>p.submission_id===own(d)?.id)){msg('Du må laste opp minst ett bilde før levering.',true);return}if(!confirm('Vil du levere oppgaven til instruktør?'))return}try{await check(await db.rpc('save_training_submission',{p_day_id:d.id,p_answers:f.answers,p_reflection:f.reflection,p_submit:submit}));await refresh();msg(submit?'Oppgaven er levert til instruktør.':'Kladden er lagret.');}catch(e){msg('Lagring mislyktes: '+errorText(e),true)}}
async function uploadImages(){const d=days.find(x=>x.id===selectedDay),input=$('image');if(!input.files.length){msg('Velg bilder først.',true);return}for(const f of input.files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10485760){msg('Bare JPG/PNG/WebP under 10 MB per bilde.',true);return}}try{const f=fields();const id=await check(await db.rpc('save_training_submission',{p_day_id:d.id,p_answers:f.answers,p_reflection:f.reflection,p_submit:false}));for(const file of input.files){const path=`${user.id}/${id}/${crypto.randomUUID()}.${file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'}`;await check(await db.storage.from('training-photos').upload(path,file,{contentType:file.type,upsert:false}));await check(await db.from('submission_photos').insert({submission_id:id,storage_path:path}));}await refresh();msg('Bilde(r) lastet opp og lagret.');}catch(e){msg('Opplasting mislyktes: '+errorText(e),true)}}
function renderInstructor(){const pending=submissions.filter(s=>s.status==='submitted');$('app').innerHTML=`<div class="panel"><h1>Instruktørpanel</h1><p>${pending.length} innlevering(er) venter på vurdering.</p><label>Velg lærling</label><select id="who" onchange="showInstructorList()"><option value="">Alle lærlinger</option>${learners.map(l=>`<option value="${esc(l.id)}">${esc(l.full_name)}</option>`).join('')}</select></div><div id="instructorlist"></div>`;showInstructorList()}
function showInstructorList(){const id=$('who')?.value||'';const rows=submissions.filter(s=>!id||s.apprentice_id===id);$('instructorlist').innerHTML=rows.length?rows.map(s=>{let d=days.find(x=>x.id===s.training_day_id),l=learners.find(x=>x.id===s.apprentice_id);return `<div class="panel"><b>${esc(l?.full_name||'Lærling')} · Dag ${d?.day_number||'?'}: ${esc(d?.title||'')}</b><p><span class="tag ${s.status==='approved'?'ok':''}">${esc(statusText[s.status]||s.status)}</span></p><button class="secondary" onclick="openReview('${s.id}')">Se svar / vurder</button></div>`}).join(''):'<div class="panel">Ingen innleveringer funnet ennå.</div>'}
function openReview(id){selectedSubmission=id;render()}
function renderReview(){const s=submissions.find(x=>x.id===selectedSubmission),d=days.find(x=>x.id===s?.training_day_id),l=learners.find(x=>x.id===s?.apprentice_id);if(!s||!d){back();return}const qs=d.theory_questions||[];$('app').innerHTML=`<button class="secondary" onclick="back()">← Til instruktørpanel</button><div class="panel" style="margin-top:14px"><h1>Dag ${d.day_number}: ${esc(d.title)}</h1><p>Lærling: <b>${esc(l?.full_name||'Ukjent')}</b> · ${esc(statusText[s.status]||s.status)}</p><h2>Teori</h2>${qs.map((q,i)=>`<p><b>${esc(q)}</b></p><p>${esc(s.theory_answers?.[i]||'IKKE BESVART')}</p>`).join('')}<h2>Praktisk</h2><p>${esc(d.practical_instructions)}</p><div id="photolist" class="photos"></div><h2>Egenvurdering</h2><p>${esc(s.reflection||'IKKE BESVART')}</p><label>Tilbakemelding til lærling</label><textarea id="feedback">${esc(s.instructor_feedback||'')}</textarea><label>Vurdering</label><select id="decision"><option value="approved">Godkjent – åpne neste oppgave</option><option value="repeat">Øv mer – send tilbake</option><option value="guided">Gjennomgå med instruktør</option><option value="continue">Fortsett arbeidet</option></select><div class="actions"><button onclick="review()">Lagre vurdering</button></div></div>`;renderPhotoList(s.id)}
async function review(){try{await check(await db.rpc('review_training_submission',{p_submission_id:selectedSubmission,p_status:$('decision').value,p_feedback:$('feedback').value.trim()}));selectedSubmission=null;await refresh();msg('Vurderingen er lagret.')}catch(e){msg('Vurdering mislyktes: '+errorText(e),true)}}
function renderSettings(){$('app').innerHTML=`<div class="panel"><h1>Oppsett</h1><p>Opprett lærlingkonto i Supabase → Authentication → Users, og registrer samme bruker i <code>profiles</code> med rollen <code>apprentice</code>. Deretter kan du aktivere lærlingen her.</p><label>Lærling</label><select id="enrollUser">${learners.map(l=>`<option value="${esc(l.id)}">${esc(l.full_name)}</option>`).join('')}</select><label>Startdato</label><input id="startDate" type="date" value="${new Date().toISOString().slice(0,10)}"><div class="actions"><button onclick="enroll()">Aktiver lærling</button></div><h2>Publiserte dager</h2><p>${days.filter(d=>d.is_published).length} av 15 dager publisert. Oppgaver kan redigeres direkte i Supabase-tabellen <code>training_days</code> i denne versjonen.</p></div>`}
async function enroll(){try{const id=$('enrollUser').value;if(!id)throw Error('Opprett en lærlingkonto først');await check(await db.from('enrollments').upsert({apprentice_id:id,start_date:$('startDate').value},{onConflict:'apprentice_id'}));await refresh();msg('Lærlingen er aktivert.')}catch(e){msg('Aktivering mislyktes: '+errorText(e),true)}}
if(!db)loginForm('Supabase-biblioteket kunne ikke lastes. Sjekk internett.');else start();
</script></body></html>
