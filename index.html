<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stord Academy · Opplæring</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18293b;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{background:#102b46;color:white;padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:22px}header small{display:block;color:#b9d3e9}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,select,input,textarea{font:inherit}button{border:0;border-radius:9px;background:#1765a0;color:white;padding:10px 14px;cursor:pointer}button.secondary{background:#e4ecf3;color:#153a58}button.danger{background:#a42b37}button:disabled{opacity:.45;cursor:not-allowed}.tabs button.active{background:#102b46}.panel{background:white;border:1px solid #dce5ed;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #12283b09}h1{font-size:25px;margin:0 0 7px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:10px 0}p{line-height:1.55}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.task{border:1px solid #dce5ed;border-radius:11px;padding:15px;background:#fff;cursor:pointer}.task:hover{border-color:#1765a0}.task.locked{opacity:.55;cursor:default}.tag{display:inline-block;background:#e9f0f6;color:#21465f;border-radius:20px;padding:4px 9px;font-size:12px;margin-top:6px}.tag.done{background:#d8f5e4;color:#116236}.tag.work{background:#fff0cb;color:#795008}.tag.review{background:#e6e2ff;color:#4d3994}label{display:block;font-weight:600;margin:14px 0 6px}input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid #c9d5df;border-radius:8px;background:white}textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.notice{background:#eaf4ff;border-left:4px solid #2473a9;padding:12px;border-radius:7px}.photos{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.photos img{width:130px;height:105px;object-fit:cover;border-radius:8px;cursor:pointer}.mini{font-size:13px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eaf1f7;padding:14px;border-radius:10px;text-align:center}.stat b{display:block;font-size:23px}.weektitle{margin:24px 0 10px}.footer{font-size:12px;color:#66788a;margin-top:25px} @media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.panel{padding:15px}}
</style></head><body><header><div><strong>STORD ACADEMY</strong><small>Isolatørfaget · Digital opplæring · Prototype 1</small></div><span id="identity"></span></header><main class="wrap"><div class="tabs"><button id="tab-learner" onclick="setTab('learner')">Lærling</button><button id="tab-instructor" onclick="setTab('instructor')">Instruktør</button><button id="tab-settings" onclick="setTab('settings')">Oppsett</button></div><div id="app"></div><p class="footer">Prototype for utprøving. Data lagres kun lokalt i denne nettleseren på denne enheten. Ikke et produksjonssystem; ingen ekte innlogging, synkronisering eller sikker skylagring.</p></main><script>
const base=[
['Første T-stykke','Hvilke verktøy bruker vi til måling, oppmerking og klipping?','Hvorfor er riktig verneutstyr viktig?','Se instruktørens demonstrasjon. Lag ditt første T-stykke i aluminium med veiledning.','Oppmerking og ferdig del'],
['T-stykke – repetisjon','Hva er forskjellen på diameter og omkrets?','Hvordan kontrollerer du målene dine?','Lag et nytt T-stykke, gjerne med samme mål. Forsøk flere arbeidsoperasjoner selv.','Første og andre forsøk'],
['Første kon','Hva er en konisk overgang?','Hvorfor bruker vi overlapp?','Lag en enkel kon i aluminium etter mal eller demonstrasjon.','Utklipp og ferdig kon'],
['Kon – repetisjon','Hvorfor er nøyaktig oppmerking viktig?','Hva kan skje dersom du klipper feil?','Lag kon nummer to. Øv på måling, klipping, forming og sammenføyning.','Sammenligning av to forsøk'],
['Sammenstilling','Hva er hensikten med overlapp og skjøter?','Hvordan kontrollerer du passformen?','Lag eller tilpass rett kapsel og sett sammen T-stykke, kon og kapsel.','Ferdig sammenstilling'],
['Første bend','Hva er forskjellen på rett kapsel og bend?','Hvorfor må delene passe sammen?','Lag et enkelt segmentbend i aluminium med instruktørveiledning.','Segmenter og ferdig bend'],
['Bend – repetisjon','Hvordan påvirker feil mål sammenstillingen?','Hva vil du kontrollere før montering?','Lag et nytt bend, gjerne i samme dimensjon. Øv på skjøter og passform.','Første og andre bend'],
['T-stykke og kon igjen','Beskriv arbeidsrekkefølgen for et T-stykke.','Beskriv arbeidsrekkefølgen for en kon.','Gjenta tidligere komponenter med mindre hjelp der du er klar.','Arbeidsprosess og ferdige deler'],
['Rett kapsel','Hvordan finner vi omkretsen til en sirkel?','Hvorfor legger vi til overlapp?','Mål, merk, klipp og form rette aluminiumskapsler.','Utregning og ferdig kapsel'],
['Samlet repetisjon','Hvilke feil kan oppstå ved oppmerking?','Hvordan kan du kontrollere eget arbeid?','Lag eller forbedre en sammenstilling med bend, kon, T-stykke og rett kapsel.','Sammenstilling og forbedringer'],
['Oppmåling på jiggen','Hva må du måle før du lager isolasjon og kapsling?','Hvorfor lager vi en enkel skisse?','Velg et enkelt område på jiggen, mål rør og avstander og lag en enkel håndskisse.','Jigg og målsatt skisse'],
['Isolasjonsmaterialer','Hva kjennetegner mineralull, celleglass og Armaflex/K-Flex?','Hva må du ta hensyn til ved materialvalg?','Bli kjent med de tre materialene. Øv på enkel oppmåling, tilpasning og montering på egnet del av jiggen.','Materialer og arbeidsprosess'],
['Isolering og rett kapsling','Hvorfor er riktig tilpasning viktig?','Hvorfor må skjøter utføres riktig?','Monter valgt isolasjon og produser en enkel rett aluminiumskapsel utenpå.','Før, under og etter'],
['Tilpasning på jiggen','Hvordan kontrollerer du at kapslingen passer?','Hvordan unngår du å skade isolasjonen?','Fortsett på jiggen. Tilpass bend, T-stykke eller kon til valgt område med veiledning.','Tilpasning og ferdig resultat'],
['Repetisjon og gjennomgang','Hva har du lært om verktøy og HMS?','Hva vil du øve mer på neste gang?','Ferdigstill påbegynte arbeider, gjenta en arbeidsoperasjon eller forbedre tidligere utførelse.','Resultat og egenvurdering']
];
const key='stord-academy-training-v1';let store;try{store=JSON.parse(localStorage.getItem(key))||{}}catch(e){store={}};
store.tasks??=base.map((a,i)=>({id:i+1,day:i+1,title:a[0],q1:a[1],q2:a[2],practical:a[3],photoHint:a[4]}));store.learners??=['Lærling 1'];store.current??='Lærling 1';store.day??=1;store.records??={};store.tab??='learner';store.selected??=null;function save(){try{localStorage.setItem(key,JSON.stringify(store))}catch(e){alert('Lagringsplassen i nettleseren er full. Prøv færre eller mindre bilder.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rec(id,who=store.current){store.records[who]??={};store.records[who][id]??={a1:'',a2:'',reflection:'',photos:[],status:'Ikke startet',note:''};return store.records[who][id]}function setTab(t){store.tab=t;store.selected=null;save();render()}function statusClass(s){return s==='Godkjent'?'done':s==='Pågår'?'work':s==='Til vurdering'?'review':''}function render(){document.getElementById('identity').textContent=store.current;for(let t of ['learner','instructor','settings'])document.getElementById('tab-'+t).classList.toggle('active',store.tab===t);let el=document.getElementById('app');if(store.tab==='learner')renderLearner(el);else if(store.tab==='instructor')renderInstructor(el);else renderSettings(el)}
function renderLearner(el){if(store.selected!==null)return renderTask(el,store.selected);let records=store.tasks.filter(t=>t.day<=store.day).map(t=>rec(t.id));let approved=records.filter(r=>r.status==='Godkjent').length;el.innerHTML=`<div class="panel"><h1>Mine opplæringsoppgaver</h1><p class="muted">Alle oppgaver åpnes på planlagt dag. Du kan fortsette med eldre oppgaver så lenge du trenger.</p><div class="stats"><div class="stat"><b>${store.day}</b><span class="mini">Åpnet dag</span></div><div class="stat"><b>${approved}</b><span class="mini">Godkjent</span></div><div class="stat"><b>${records.length-approved}</b><span class="mini">Ikke godkjent ennå</span></div></div></div>`+ [0,1,2].map(w=>`<h2 class="weektitle">Uke ${w+1} · ${['Verktøy, T-stykke og kon','Bend og repetisjon','Isolasjon og jiggen'][w]}</h2><div class="grid">`+store.tasks.slice(w*5,w*5+5).map(t=>{let locked=t.day>store.day;let r=locked?null:rec(t.id);return `<div class="task ${locked?'locked':''}" ${locked?'':`onclick="openTask(${t.id})"`}><strong>Dag ${t.day}: ${esc(t.title)}</strong><div><span class="tag ${r?statusClass(r.status):''}">${locked?'Åpnes dag '+t.day:esc(r.status)}</span></div></div>`}).join('')+'</div>').join('')}
function openTask(id){store.selected=id;save();render()}function back(){store.selected=null;save();render()}function renderTask(el,id){let t=store.tasks.find(x=>x.id===id);if(!t||t.day>store.day){back();return}let r=rec(id);el.innerHTML=`<button class="secondary" onclick="back()">← Til alle oppgaver</button><div class="panel" style="margin-top:14px"><div class="muted">Uke ${Math.ceil(t.day/5)} · Dag ${t.day}</div><h1>${esc(t.title)}</h1><span class="tag ${statusClass(r.status)}">${esc(r.status)}</span>${r.note?`<div class="notice" style="margin-top:14px"><b>Tilbakemelding fra instruktør:</b><p>${esc(r.note)}</p></div>`:''}<h2 style="margin-top:20px">Teori</h2><label>1. ${esc(t.q1)}</label><textarea id="a1">${esc(r.a1)}</textarea><label>2. ${esc(t.q2)}</label><textarea id="a2">${esc(r.a2)}</textarea><h2 style="margin-top:20px">Praktisk oppgave</h2><p>${esc(t.practical)}</p><div class="notice">Jobb i ditt eget tempo. Er du ikke ferdig i dag, kan du fortsette senere.</div><label>Bilder – ${esc(t.photoHint)}</label><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(event,${id})"><div class="photos">${r.photos.map((p,i)=>`<div><img src="${p}" alt="Innlevert bilde" onclick="window.open(this.src,'_blank')"><br><button class="secondary mini" onclick="removePhoto(${id},${i})">Fjern</button></div>`).join('')}</div><label>Hva har du lært? Hva trenger du å øve mer på?</label><textarea id="reflection">${esc(r.reflection)}</textarea><div class="actions"><button class="secondary" onclick="saveTask(${id},false)">Lagre og fortsett senere</button><button onclick="saveTask(${id},true)">Send til instruktør</button></div></div>`}
function saveTask(id,submit){let r=rec(id);r.a1=document.getElementById('a1').value;r.a2=document.getElementById('a2').value;r.reflection=document.getElementById('reflection').value;if(submit){if(!confirm('Vil du sende oppgaven til instruktør? Du kan fortsette å jobbe med den senere hvis det trengs.'))return;r.status='Til vurdering'}else if(r.status!=='Godkjent')r.status='Pågår';save();back()}function addPhotos(event,id){let files=[...event.target.files];let r=rec(id);if(r.photos.length+files.length>8){alert('Maks 8 bilder per oppgave i denne prototypen.');return}Promise.all(files.map(f=>new Promise(resolve=>{let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/img.width,1000/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.67))};img.onerror=()=>resolve(null);img.src=url}))).then(arr=>{r.photos.push(...arr.filter(Boolean));if(r.status==='Ikke startet')r.status='Pågår';save();render()})}function removePhoto(id,i){rec(id).photos.splice(i,1);save();render()}
function renderInstructor(el){let who=store.current;let counts={};store.tasks.filter(t=>t.day<=store.day).forEach(t=>{let s=rec(t.id,who).status;counts[s]=(counts[s]||0)+1});el.innerHTML=`<div class="panel"><h1>Instruktørpanel</h1><p class="muted">Velg lærling, vurder oppgaver og rediger innhold. Instruktørmodus er ikke passordbeskyttet i denne demonstrasjonen.</p><label>Lærling</label><select onchange="store.current=this.value;save();render()">${store.learners.map(x=>`<option ${x===who?'selected':''}>${esc(x)}</option>`).join('')}</select><p><strong>${counts['Godkjent']||0}</strong> godkjent · <strong>${counts['Til vurdering']||0}</strong> til vurdering · <strong>${counts['Pågår']||0}</strong> pågår</p></div><div class="panel"><h2>Oppgaver og vurdering</h2>${store.tasks.filter(t=>t.day<=store.day).map(t=>{let r=rec(t.id,who);return `<div style="padding:12px 0;border-bottom:1px solid #e1e8ef"><div class="row"><div><b>Dag ${t.day}: ${esc(t.title)}</b><br><span class="tag ${statusClass(r.status)}">${esc(r.status)}</span></div><div style="text-align:right"><button class="secondary" onclick="review(${t.id})">Se svar / vurder</button> <button class="secondary" onclick="editTask(${t.id})">Rediger oppgave</button></div></div></div>`}).join('')}</div>`}
function review(id){let t=store.tasks.find(t=>t.id===id),r=rec(id);document.getElementById('app').innerHTML=`<button class="secondary" onclick="render()">← Til instruktørpanel</button><div class="panel" style="margin-top:14px"><h1>Dag ${id}: ${esc(t.title)}</h1><p>Lærling: <b>${esc(store.current)}</b></p><h2>Teori</h2><p><b>${esc(t.q1)}</b></p><p>${esc(r.a1)||'<i>IKKE BESVART</i>'}</p><p><b>${esc(t.q2)}</b></p><p>${esc(r.a2)||'<i>IKKE BESVART</i>'}</p><h2>Praktisk</h2><p>${esc(t.practical)}</p><div class="photos">${r.photos.map(p=>`<img src="${p}" onclick="window.open(this.src,'_blank')">`).join('')||'Ingen bilder levert'}</div><h2>Egenvurdering</h2><p>${esc(r.reflection)||'<i>IKKE BESVART</i>'}</p><label>Tilbakemelding</label><textarea id="feedback">${esc(r.note)}</textarea><label>Vurdering</label><select id="reviewStatus">${['Pågår','Til vurdering','Godkjent','Godkjent med veiledning','Repetisjon anbefales','Gjennomgå med instruktør'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="actions"><button onclick="finishReview(${id})">Lagre vurdering</button></div></div>`}function finishReview(id){let r=rec(id);r.note=document.getElementById('feedback').value;r.status=document.getElementById('reviewStatus').value;save();render()}
function editTask(id){let t=store.tasks.find(t=>t.id===id);document.getElementById('app').innerHTML=`<button class="secondary" onclick="render()">← Til instruktørpanel</button><div class="panel" style="margin-top:14px"><h1>Rediger dag ${id}</h1>${[['title','Tittel'],['q1','Teorispørsmål 1'],['q2','Teorispørsmål 2'],['practical','Praktisk oppgave'],['photoHint','Ønskede bilder']].map(([k,l])=>`<label>${l}</label><textarea id="edit_${k}">${esc(t[k])}</textarea>`).join('')}<div class="actions"><button onclick="finishEdit(${id})">Lagre endringer</button></div></div>`}function finishEdit(id){let t=store.tasks.find(t=>t.id===id);['title','q1','q2','practical','photoHint'].forEach(k=>t[k]=document.getElementById('edit_'+k).value);save();render()}
function renderSettings(el){el.innerHTML=`<div class="panel"><h1>Oppsett og testing</h1><p>Her kan du prøve hvordan nye dagsoppgaver åpnes, uten å måtte vente 15 virkelige dager.</p><label>Åpne oppgaver til og med dag</label><input type="number" min="1" max="15" value="${store.day}" onchange="store.day=Math.max(1,Math.min(15,Number(this.value)||1));save();render()"><label>Legg til lærling</label><div class="row"><input id="newLearner" type="text" placeholder="Navn på testlærling"><button onclick="addLearner()">Legg til</button></div><label>Velg aktiv lærling</label><select onchange="store.current=this.value;save();render()">${store.learners.map(x=>`<option ${x===store.current?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="actions"><button class="secondary" onclick="exportData()">Eksporter testdata (JSON)</button><button class="danger" onclick="resetData()">Nullstill all testdata</button></div></div><div class="panel"><h2>Viktig før ekte bruk</h2><p>Denne første prototypen er laget for å teste oppgaver, skjermbilder og arbeidsflyt. Den har <b>ikke</b> ekte brukerinnlogging, sentral database, tilgangskontroll eller sikker lagring av lærlingbilder. Den må videreutvikles og godkjennes før den tas i bruk med reelle lærlinger.</p></div>`}function addLearner(){let n=document.getElementById('newLearner').value.trim();if(!n)return;if(store.learners.includes(n)){alert('Lærlingen finnes allerede');return}store.learners.push(n);store.current=n;save();render()}function exportData(){let b=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='stord-academy-testdata.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function resetData(){if(confirm('Vil du slette alle testdata og tilbakestille oppgavene i denne nettleseren?')){localStorage.removeItem(key);location.reload()}}render();
</script></body></html>
